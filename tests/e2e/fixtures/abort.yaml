# A run deliberately made slow, so it is still working when it is stopped
# from outside. Five effective viewports with a long settle and a long pause
# per scroll step: the signal arrives in the middle of a capture, which is
# exactly the situation a person creates with ctrl-c.
version: 1
viewports:
  presets:
    - hd
    - phone-medium
    - tablet-portrait
  derived: true
stabilize:
  settleMs: 3000
  scrollSettleMs: 1500
  networkIdleTimeout: 3000
print:
  enabled: false
