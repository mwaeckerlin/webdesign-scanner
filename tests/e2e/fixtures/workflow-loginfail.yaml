version: 1
name: e2e-login-that-does-not-arrive
description: signs in correctly but demands a page that does not exist

defaults:
  timeout: 5000

steps:

  - action: waitForLoadState
    state: load

  - action: click
    label: accept cookies
    when:
      visible:
        role: button
        name: Accept all
    target:
      role: button
      name: Accept all

  - action: fill
    target:
      label: User name
    value:
      env: SCAN_USERNAME

  - action: fill
    target:
      label: Password
    value:
      file: /run/secrets/scan_password

  - action: click
    target:
      role: button
      name: Sign in

  - action: waitForUrl
    url: "**/app.html"

  # this is the assertion that must abort the run
  - action: expectVisible
    label: a heading that the application does not have
    target:
      role: heading
      name: Administration

  - action: ready
